name: Verify native toolkit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Activate runner PowerShell for script fixtures
        shell: bash
        run: |
          toolkit_test_pwsh=$(command -v pwsh)
          test -x "$toolkit_test_pwsh"
          echo "TOOLKIT_TEST_PWSH=$toolkit_test_pwsh" >> "$GITHUB_ENV"
      - run: dotnet restore LocalDeviceToolkit.sln --locked-mode
      - run: dotnet build LocalDeviceToolkit.sln -c Release --no-restore -warnaserror
      - run: dotnet test LocalDeviceToolkit.sln -c Release --no-restore -warnaserror --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: portable-test-results
          path: TestResults
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore LocalDeviceToolkit.sln --locked-mode
      - run: dotnet build LocalDeviceToolkit.sln -c Release --no-restore -warnaserror
      - run: dotnet test LocalDeviceToolkit.sln -c Release --no-restore -warnaserror --logger trx --results-directory TestResults
      - name: Parse scripts using Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1.' }
          Get-ChildItem build,scripts,packaging -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if (@($errors).Count) { throw ($errors -join '; ') }
          }
          ./build/Verify-ScriptRegistry.ps1
      - name: Build portable ZIP
        shell: powershell
        run: ./build/Publish-Portable.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/dist/LocalDeviceToolkit-win-x64"
      - name: Verify complete portable archive integrity
        shell: powershell
        run: ./build/Test-Portable.ps1 -ZipPath "$env:GITHUB_WORKSPACE/dist/LocalDeviceToolkit-win-x64.zip" -ResultPath "$env:GITHUB_WORKSPACE/dist/package-verification.json" -ExpectedCommit $env:GITHUB_SHA
      - name: Extract and render the actual packaged application
        shell: powershell
        run: |
          $archive=Join-Path $env:GITHUB_WORKSPACE 'dist/LocalDeviceToolkit-win-x64.zip'
          $extract=Join-Path $env:RUNNER_TEMP 'Extracted toolkit – native test'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($archive,$extract)
          $runtime=Get-Content (Join-Path $extract 'LocalDeviceToolkit.App.runtimeconfig.json') -Raw | ConvertFrom-Json
          if ($runtime.runtimeOptions.PSObject.Properties.Name -contains 'framework' -or $runtime.runtimeOptions.PSObject.Properties.Name -contains 'frameworks') { throw 'Application is framework-dependent.' }
          if (-not (Test-Path (Join-Path $extract 'coreclr.dll'))) { throw 'Bundled runtime is missing.' }
          $render=Join-Path $env:GITHUB_WORKSPACE 'dist/native-renders'
          $start=New-Object Diagnostics.ProcessStartInfo
          $start.FileName=Join-Path $extract 'LocalDeviceToolkit.App.exe'
          $start.UseShellExecute=$false
          $start.Arguments='--smoke-output "'+$render+'"'
          $start.EnvironmentVariables.Remove('DOTNET_ROOT')
          $start.EnvironmentVariables.Remove('DOTNET_ROOT_X64')
          $start.EnvironmentVariables['PATH']=($env:PATH -split ';' | Where-Object {$_ -notmatch '(?i)dotnet'}) -join ';'
          $app=[Diagnostics.Process]::Start($start)
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Read-only native render timed out.' }
          if ($app.ExitCode -ne 0) { throw "Packaged application failed: $($app.ExitCode)" }
          foreach ($page in @('home','setup','diagnostics','deployments','reports','setup-compact','diagnostics-compact','deployments-compact','reports-compact','saved-reports','deployment-inputs','recorded-restoration','manual-review','setting-inputs','saved-reports-compact','deployment-inputs-compact','recorded-restoration-compact','manual-review-compact','setting-inputs-compact','task-review','task-review-compact','incident-inputs','incident-inputs-compact','network-inputs','network-inputs-compact','power-timeout','power-timeout-compact','dns-refresh','dns-refresh-compact','defender-request','defender-request-compact','engineer-handover','engineer-handover-compact','setup-local','setup-local-compact','diagnostics-local','diagnostics-local-compact')) {
            $image=Get-Item (Join-Path $render ($page+'.png'))
            if ($image.Length -lt 1024) { throw "Native render is empty: $page" }
          }
      - name: Build and verify lightweight package
        shell: powershell
        run: |
          ./build/Publish-Portable.ps1 -Lightweight -OutputDirectory "$env:GITHUB_WORKSPACE/dist/LocalDeviceToolkit-lightweight-win-x64"
          ./build/Test-Portable.ps1 -ZipPath "$env:GITHUB_WORKSPACE/dist/LocalDeviceToolkit-lightweight-win-x64.zip" -ResultPath "$env:GITHUB_WORKSPACE/dist/lightweight-package-verification.json" -ExpectedCommit $env:GITHUB_SHA
      - name: Install missing runtime and launch WPF without administrator rights
        shell: powershell
        run: ./build/Test-LightweightStartup.ps1 -ZipPath "$env:GITHUB_WORKSPACE/dist/LocalDeviceToolkit-lightweight-win-x64.zip" -OutputDirectory "$env:GITHUB_WORKSPACE/dist/lightweight-evidence"
      - name: Upload small engineer download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineer-lightweight-win-x64
          path: |
            dist/LocalDeviceToolkit-lightweight-win-x64.zip
            dist/LocalDeviceToolkit-lightweight-win-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-package-and-native-evidence
          path: |
            dist/*.zip
            dist/*.sha256
            dist/package-verification.json
            dist/lightweight-package-verification.json
            dist/lightweight-evidence/**
            dist/native-renders/*.png
            dist/native-renders/*.log
            TestResults
